<!-- contact.html -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | ArtBhavan</title>
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    
</head>
<body>
    <div class="container my-5">
        <div class="text-center mb-4">
            <h2 class="contact-heading fw-bold"><i class="fas fa-envelope-open-text me-2"></i>Contact Us</h2>
            <p style="color: #ccc;">We'd love to hear from you! Whether you have a question, feedback, or just want to say hello.</p>
        </div>

        <div class="row g-5">
            <!-- Contact Form -->
            <div class="col-md-7">
                <div class="contact-container">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Write your message..." required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn-send mt-3"><i class="fas fa-paper-plane me-1"></i>Send Message</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="col-md-5">
                <div class="contact-container h-100">
                    <h5 class="mb-4 text-warning">Get in Touch</h5>
                    <p style="color: #ccc;" class="contact-info"><i class="fas fa-map-marker-alt"></i>123 Art Street, Kochi, Kerala, India</p>
                    <p style="color: #ccc;" class="contact-info"><i class="fas fa-phone"></i>+91 123-456-7890</p>
                    <p style="color: #ccc;" class="contact-info"><i class="fas fa-envelope"></i>artbhavan@gmail.com</p>
                    <div class="mt-4">
                        <h6 class="text-warning">Follow Us</h6>
                        <div class="social-icons mt-2">
                            <a href="#"><i class="fab fa-facebook-f"></i></a>
                            <a href="#"><i class="fab fa-instagram"></i></a>
                            <a href="#"><i class="fab fa-twitter"></i></a>
                            <a href="#"><i class="fab fa-pinterest"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>    
</body>
</html>
