{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ArtBhavan | Signup</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/modern_signup.css' %}">

    <!-- GSAP & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
</head>

<body>

    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>
    <div class="custom-cursor-follower"></div>

    <!-- Background Glow -->
    <div class="bg-glow"></div>

    <!-- Fixed Glass Navbar -->
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="/" class="brand-logo">Art<span>Bhavan</span></a>
            <div class="nav-links d-none d-md-flex gap-4">
                <a href="/" class="text-decoration-none text-white opacity-75 hover-opacity-100">Home</a>
                <a href="{% url 'collection' %}"
                    class="text-decoration-none text-white opacity-75 hover-opacity-100">Collection</a>
                <a href="{% url 'about' %}"
                    class="text-decoration-none text-white opacity-75 hover-opacity-100">About</a>
                <a href="{% url 'contact' %}"
                    class="text-decoration-none text-white opacity-75 hover-opacity-100">Contact</a>
            </div>
            <div class="nav-actions">
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-warning rounded-pill px-4">Login</a>
            </div>
        </div>
    </nav>

    <!-- Perspective Wrapper for 3D effect -->
    <div class="perspective-wrapper">
        <!-- Signup Card -->
        <div class="signup-card">
            <div class="signup-header">
                <h1 class="signup-title">Join The <span>Community</span></h1>
                <p class="signup-subtitle">Create an account to start your artistic journey with us.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group-modern">
                    <input type="text" name="identifier" class="input-modern" placeholder="Username" required>
                </div>

                <div class="form-group-modern">
                    <input type="email" name="email" class="input-modern" placeholder="Email Address" required>
                </div>

                <div class="form-group-modern">
                    <input type="password" name="password" class="input-modern" placeholder="Password" required>
                </div>

                <div class="form-group-modern">
                    <input type="password" name="Confirm Password" class="input-modern" placeholder="Confirm Password"
                        required>
                </div>

                <button type="submit" class="btn-premium">
                    Create Account
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login-group">
                <button class="google-btn-modern" type="button">
                    <img src="https://img.icons8.com/color/20/000000/google-logo.png" alt="Google Icon">
                    Continue with Google
                </button>
            </div>

            <div class="login-redirect">
                Already have an account? <a href="{% url 'login' %}">Login Here</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/modern_signup.js' %}"></script>
</body>

</html>
