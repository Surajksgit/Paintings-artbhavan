<!-- artwork_detail.html -->

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ artwork.title }}</title>
    <link href="{% static 'css/artwork_detail.css' %}" rel="stylesheet">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YUe2LzesAfftltw+PEaao2tjU/QATaW/rOitAq67e0CT0Zi2VVRL0oC4+gAaeBKu" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
</head>
<body>
<div class="container my-5">
    <div class="row g-5">
        <div class="col-md-6">
            <img src="{{ artwork.image.url }}" class="img-fluid rounded shadow-sm">
        </div>
        <div class="col-md-6">
            <h2 class="mb-3"> {{ artwork.title }}</h2>
            <h5 class="text-muted " >Category : {{ artwork.category }}</h5>
            <h6 class="text-muted" style="font-size: 0.9rem; color: #fff;">Size : {{ artwork.height }}cm x {{ artwork.width }}cm</h6>
            <h4 class="text-success fw-bold mb-3"> ₹{{ artwork.price }}</h4>
            <p class="lead">{{ artwork.description }}</p>
            <button class="btn ">Add to Cart</button>
        </div>
    </div>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
